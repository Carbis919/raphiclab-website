<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 52" width="196" height="52">

  <!-- Teal base square -->
  <rect x="0" y="0" width="52" height="52" fill="#009FCC" rx="2"/>

  <!-- White cutout: top-right opening of the G -->
  <path fill="white" d="M 30,4 L 48,4 L 48,26 L 22,26 L 22,18 L 40,18 L 40,12 L 30,12 Z"/>

  <!-- Teal G shape: left bar -->
  <rect x="4" y="4" width="18" height="44" fill="#009FCC" rx="1"/>
  <!-- Teal G shape: top bar -->
  <rect x="4" y="4" width="44" height="10" fill="#009FCC"/>
  <!-- Teal G shape: bottom bar -->
  <rect x="4" y="40" width="44" height="8" fill="#009FCC"/>
  <!-- Teal G shape: crossbar (middle arm) -->
  <rect x="22" y="22" width="26" height="8" fill="#009FCC"/>
  <!-- Teal G shape: right lower stub -->
  <rect x="38" y="26" width="10" height="14" fill="#009FCC"/>

  <!-- Green swoosh — lower arc across bottom of icon -->
  <path d="M 4,50 L 4,38 Q 26,28 52,40 L 52,52 L 4,52 Z" fill="#78B926"/>

  <!-- "Graphic" wordmark — bold teal -->
  <text x="62" y="30"
    font-family="'Arial Black', 'Franklin Gothic Heavy', Impact, Arial, sans-serif"
    font-size="21"
    font-weight="900"
    fill="#009FCC"
    letter-spacing="-0.3">Graphic</text>

  <!-- "LAB" badge — dark pill with green text -->
  <rect x="62" y="35" width="48" height="14" rx="2" fill="#111111"/>
  <text x="86" y="46"
    font-family="Arial, 'Helvetica Neue', sans-serif"
    font-size="9"
    font-weight="700"
    fill="#78B926"
    text-anchor="middle"
    letter-spacing="3.5">LAB</text>

</svg>
